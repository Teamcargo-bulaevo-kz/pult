plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.teamcargo.pult'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.teamcargo.pult'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
