name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle testDebugUnitTest --console=plain

      - name: Build debug APK
        run: |
          gradle assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk pult-telekarta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pult-telekarta-apk
          path: pult-telekarta.apk

      - name: Publish release (APK download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Пульт Телекарта, сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: pult-telekarta.apk
